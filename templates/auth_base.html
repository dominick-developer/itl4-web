<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IT Level 4 Connect{% endblock %}</title>

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0B1F33">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ITL4">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="icon" href="/static/icon-192.png">

    <style>
        :root {
            --navy: #0B1F33;
            --orange: #F47721;
            --teal: #0E8F78;
            --success: #16A34A;
            --warning: #F59E0B;
            --danger: #DC2626;
            --info: #2563EB;
            --bg: #F5F7FA;
            --border: #E2E8F0;
            --text: #0F172A;
            --muted: #64748B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 17px;
            line-height: 1.6;
        }

        a {
            color: var(--info);
            text-decoration: none;
        }

        /* BUTTONS */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            display: inline-block;
            text-decoration: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--orange);
            color: white;
        }

        .btn-primary:hover {
            background: #e6670f;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        /* FORMS */
        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            background: white;
            color: var(--text);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(244, 119, 33, .15);
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--navy);
            font-size: 15px;
        }

        /* CARD */
        .card {
            background: white;
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 32px;
            margin-bottom: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media(max-width:640px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>
    {% block body %}{% endblock %}

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => { });
        }
    </script>
</body>

</html>
