{% extends "base.html" %}
{% block body %}
<div class="container" style="max-width:700px;">
    <h1 style="color:var(--navy);margin-bottom:20px;">
        {{ "Edit Student" if student else "Add Student" }}
    </h1>
    <form method="post" action="{{ '/students/%d/edit'|format(student.id) if student else '/students/add' }}"
        class="card">
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="full_name" required value="{{ student.full_name if student else '' }}">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Reg Number</label>
                <input type="text" name="reg_number" value="{{ student.reg_number if student else '' }}">
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select name="gender">
                    <option value="">—</option>
                    <option value="Male" {% if student and student.gender=='Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student and student.gender=='Female' %}selected{% endif %}>Female
                    </option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Phone *</label>
                <input type="text" name="phone" required value="{{ student.phone if student else '' }}">
            </div>
            <div class="form-group">
                <label>WhatsApp</label>
                <input type="text" name="whatsapp" value="{{ student.whatsapp if student else '' }}">
            </div>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ student.email if student else '' }}">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Street/Mtaa</label>
                <input type="text" name="mtaa" value="{{ student.address if student else '' }}">
            </div>
            <div class="form-group">
                <label>House No</label>
                <input type="text" name="namba_nyumba">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Parent Name</label>
                <input type="text" name="parent_name" value="{{ student.parent_name if student else '' }}">
            </div>
            <div class="form-group">
                <label>Parent Phone</label>
                <input type="text" name="parent_phone" value="{{ student.parent_phone if student else '' }}">
            </div>
        </div>
        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="3">{{ student.notes if student else '' }}</textarea>
        </div>
        <div style="display:flex;gap:8px;">
            <button type="submit" class="btn btn-primary">{{ "Save Changes" if student else "Add Student" }}</button>
            <a href="/students" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
